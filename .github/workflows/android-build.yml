name: StructuralPro Android
on:
  workflow_dispatch:
    inputs:
      build_approved:
        description: "Owner explicitly approved producing Android build artifacts"
        required: true
        type: boolean
        default: false
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_approved == true }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Compile debug and production variants
        run: |
          gradle :app:assembleDebug :app:assembleRelease --stacktrace
