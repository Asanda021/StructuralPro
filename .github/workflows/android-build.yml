name: StructuralPro Android
on:
  pull_request:
    paths: ["android/**","mobile/**",".github/workflows/android-build.yml"]
  push:
    branches: [main]
    paths: ["android/**","mobile/**",".github/workflows/android-build.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Compile debug and production variants
        run: |
          gradle :app:assembleDebug :app:assembleRelease --stacktrace
