name: StructuralPro full tests
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  statuses: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install pytest pypdf openpyxl python-docx reportlab
      - name: Compile source
        run: python -m compileall -q core tests
      - name: Run full suite
        id: tests
        continue-on-error: true
        run: PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q tests
      - name: Publish full-suite status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          if [ "$TEST_OUTCOME" = "success" ]; then
            STATE="success"; DESC="Full StructuralPro test suite passed"
          else
            STATE="failure"; DESC="Full StructuralPro test suite failed"
          fi
          curl --fail-with-body -sS -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -d "{\"state\":\"$STATE\",\"target_url\":\"https://github.com/$GITHUB_REPOSITORY/actions\",\"description\":\"$DESC\",\"context\":\"StructuralPro / full-tests\"}"
          if [ "$TEST_OUTCOME" != "success" ]; then exit 1; fi
