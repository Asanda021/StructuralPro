name: StructuralPro full tests
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install pytest pypdf ezdxf openpyxl python-docx reportlab
      - name: Compile source
        run: python -m compileall -q core tests
      - name: Run full suite
        run: |
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q tests --ignore=tests/test_priority_7.py > pytest.log 2>&1
          rc=$?
          echo "### Pytest diagnostics" >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 pytest.log >> "$GITHUB_STEP_SUMMARY"
          exit $rc
