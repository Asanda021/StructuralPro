name: StructuralPro Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v=(Get-Content VERSION -Raw).Trim()
          if ("v$v" -ne "${{ github.ref_name }}" -and "${{ github.ref_type }}" -eq "tag") { throw "Git tag does not match VERSION: expected v$v, got ${{ github.ref_name }}" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build Windows payload
        shell: pwsh
        run: ./packaging/build_windows.ps1 -Version "${{ steps.version.outputs.version }}"
      - name: Validate packaged executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/StructuralPro/StructuralPro.exe")) { throw "StructuralPro.exe was not produced" }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $v="${{ steps.version.outputs.version }}"
          (Get-Content packaging/installer.iss) -replace '#define MyAppVersion "0.1.0"', ('#define MyAppVersion "'+$v+'"') | Set-Content packaging/installer.generated.iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/installer.generated.iss
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StructuralPro-Windows-${{ steps.version.outputs.version }}
          path: |
            dist/StructuralPro-${{ steps.version.outputs.version }}-Setup.exe
            dist/StructuralPro/
