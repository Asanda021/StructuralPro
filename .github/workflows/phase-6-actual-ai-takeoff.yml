name: Phase 6 Actual AI Takeoff
on:
  pull_request:
    paths:
      - "core/ai/actual_takeoff_v1.py"
      - "tests/test_actual_ai_takeoff_v1.py"
      - ".github/workflows/phase-6-actual-ai-takeoff.yml"
  push:
    paths:
      - "core/ai/actual_takeoff_v1.py"
      - "tests/test_actual_ai_takeoff_v1.py"
      - ".github/workflows/phase-6-actual-ai-takeoff.yml"
jobs:
  actual-ai-takeoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_actual_ai_takeoff_v1.py tests/test_p23_ai_takeoff.py tests/test_p25_ai_takeoff_production.py tests/test_p38_ai_takeoff_2.py
      - run: python -m compileall -q core/ai tests
