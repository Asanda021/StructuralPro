name: StructuralPro Windows smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install pytest pypdf ezdxf openpyxl python-docx reportlab
      - name: Compile source
        shell: pwsh
        run: python -m compileall -q core tests
      - name: Windows smoke tests
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_priority_34_windows_validation.py tests/test_release_surfaces.py
