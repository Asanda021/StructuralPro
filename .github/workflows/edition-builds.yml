name: StructuralPro Edition Builds
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to build (must match VERSION)"
        required: true
        type: string
  pull_request:
    paths:
      - "core/platform/product.py"
      - "packaging/build_windows_edition.ps1"
      - "packaging/installer-edition.iss"
      - "tests/test_product_editions_runtime.py"
      - ".github/workflows/edition-builds.yml"
  push:
    branches: [main]
    paths:
      - "core/platform/product.py"
      - "packaging/build_windows_edition.ps1"
      - "packaging/installer-edition.iss"
      - "tests/test_product_editions_runtime.py"
      - ".github/workflows/edition-builds.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_product_packaging.py tests/test_product_editions_runtime.py
  light:
    needs: contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: choco install innosetup --no-progress -y
      - shell: pwsh
        run: ./packaging/build_windows_edition.ps1 -Version (Get-Content VERSION -Raw).Trim() -Edition light
      - shell: pwsh
        run: |
          if ((Get-Content dist/StructuralPro/EDITION -Raw).Trim() -ne "light") { throw "edition marker mismatch" }
          $v=(Get-Content VERSION -Raw).Trim()
          if (-not (Test-Path "dist/StructuralPro-light-$v-Setup.exe")) { throw "light installer missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: StructuralPro-Light
          path: |
            dist/StructuralPro/
            dist/StructuralPro-light-*-Setup.exe
  standard:
    needs: contract
    runs-on: windows-latest
    steps:
