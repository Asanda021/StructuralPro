name: P65 Technical Excellence
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  p65:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q core tests
      - run: python -m pytest -q tests/test_p65_technical_excellence.py
