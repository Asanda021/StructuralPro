name: StructuralPro drawing tests
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install pytest pypdf

      - name: Compile source
        run: python -m compileall -q core tests

      - name: Run focused production and drawing tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_drawing_takeoff.py tests/test_production_pipeline.py
