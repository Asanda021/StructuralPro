name: StructuralPro drawing tests
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install pytest pypdf

      - name: Compile source
        run: python -m compileall -q core tests

      - name: Run focused production and drawing tests
        id: tests
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE"
          PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q tests/test_drawing_takeoff.py tests/test_production_pipeline.py

      - name: Publish machine-readable commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          if [ "$TEST_OUTCOME" = "success" ]; then
            STATE="success"
            DESC="Drawing and production tests passed"
          else
            STATE="failure"
            DESC="Drawing and production tests failed"
          fi

          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$STATE\",\"target_url\":\"https://github.com/$GITHUB_REPOSITORY/actions\",\"description\":\"$DESC\",\"context\":\"StructuralPro / drawing-tests\"}"

          if [ "$TEST_OUTCOME" != "success" ]; then
            exit 1
          fi
