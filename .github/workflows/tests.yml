name: StructuralPro tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install pytest pypdf
      - run: python -m compileall -q core tests
      - run: PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q tests
