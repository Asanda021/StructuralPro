name: StructuralPro tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install pytest pypdf ezdxf openpyxl python-docx reportlab
      - run: python -m compileall -q core tests
      - run: python -m py_compile app/main.py
      - run: python -m pytest -q tests/test_release_surfaces.py
      - run: |
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q tests > pytest.log 2>&1
          rc=$?
          echo "### Pytest diagnostics" >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 pytest.log >> "$GITHUB_STEP_SUMMARY"
          exit $rc
