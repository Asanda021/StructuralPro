name: P411-P420 Quantity Intelligence Reconciliation
on:
  push:
    paths: ["core/takeoff/quantity_reconciliation_v1.py","tests/test_p411_p420_quantity_intelligence_reconciliation.py","docs/P411_P420_QUANTITY_INTELLIGENCE_RECONCILIATION.md",".github/workflows/priority-411-420-quantity-reconciliation.yml"]
  pull_request:
    paths: ["core/takeoff/quantity_reconciliation_v1.py","tests/test_p411_p420_quantity_intelligence_reconciliation.py","docs/P411_P420_QUANTITY_INTELLIGENCE_RECONCILIATION.md",".github/workflows/priority-411-420-quantity-reconciliation.yml"]
jobs:
  reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_p411_p420_quantity_intelligence_reconciliation.py
      - run: python -m compileall -q core tests
