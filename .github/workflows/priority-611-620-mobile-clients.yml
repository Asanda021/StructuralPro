name: P611-P620 Mobile Android Telegram Clients
on:
  push:
    branches: ["**"]
  pull_request:
    paths:
      - "core/clients/**"
      - "tests/test_p611_p620_mobile_clients.py"
      - "android/**"
      - ".github/workflows/priority-611-620-mobile-clients.yml"
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pytest
      - run: pytest -q tests/test_p611_p620_mobile_clients.py
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle :app:assembleDebug
