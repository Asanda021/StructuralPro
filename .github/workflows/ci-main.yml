name: StructuralPro CI
# Main-push CI is intentionally enabled so every direct main update gets a visible Actions check.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: structuralpro-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest

      - name: Compile check
        run: python -m compileall -q core

      - name: Dedicated phase tests
        run: python -m pytest -q tests/test_p211_p220_bim_quantity_integrity.py

      - name: Dedicated phase tests
        run: python -m pytest -q tests/test_p241_p250_sync_conflict_integrity.py

      - name: Run full test suite
        run: python -m pytest -q

