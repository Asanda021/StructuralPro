<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StructuralPro Resources</title>
<meta name="description" content="StructuralPro documentation, installation, developer resources, operational guidance and planned AEC knowledge content.">
<style>
:root{--bg:#071222;--s:#0d1828;--r:#122033;--t:#f5f7fa;--m:#8c9aaf;--b:#2e3b4d;--a:#00d4f5;--max:1200px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.6 Inter,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}.wrap{width:min(calc(100% - 40px),var(--max));margin:auto}
header{border-bottom:1px solid var(--b);padding:28px 0}.nav{display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-weight:850;letter-spacing:.05em}.brand span,.ey{color:var(--a)}
.actions{display:flex;gap:8px;align-items:center}.btn,.lang{border:1px solid var(--b);background:var(--s);padding:9px 13px;border-radius:10px;cursor:pointer;color:var(--t)}.btn:hover,.lang:hover{border-color:var(--a)}
.hero{padding:84px 0 54px}.ey{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(42px,6vw,72px);line-height:1.03;letter-spacing:-.04em;margin:14px 0}.lead{color:var(--m);font-size:18px;max-width:780px}
.note{margin-top:28px;padding:16px 18px;border:1px solid var(--b);border-radius:14px;background:linear-gradient(145deg,var(--s),#0a1423);color:var(--m)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:34px 0 12px}.filter{border:1px solid var(--b);background:var(--s);color:var(--t);padding:9px 13px;border-radius:999px;cursor:pointer}.filter.active{border-color:var(--a);color:var(--a)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:30px 0 80px}.card{border:1px solid var(--b);background:var(--s);border-radius:16px;padding:22px;min-height:245px;display:flex;flex-direction:column}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--m);font-size:12px}.status{border-radius:999px;padding:4px 8px;background:var(--r)}.status.available{color:var(--a)}.status.planned{color:#b8c2d0}.card h2{font-size:21px;margin:14px 0 8px}.card p{color:var(--m);margin:0 0 20px;font-size:14px}.card .footer{margin-top:auto}.link{display:inline-flex;border:1px solid var(--b);padding:8px 11px;border-radius:9px;font-size:13px}.link:hover{border-color:var(--a);color:var(--a)}
footer{border-top:1px solid var(--b);padding:28px 0;color:var(--m);font-size:13px;display:flex;justify-content:space-between}
[dir=rtl] body{font-family:Vazirmatn,Tahoma,sans-serif}[dir=rtl] .nav,[dir=rtl] .meta{direction:rtl}[dir=rtl] .hero{text-align:right}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:580px){.wrap{width:min(calc(100% - 28px),var(--max))}.grid{grid-template-columns:1fr}.hero{padding-top:58px}.nav{align-items:flex-start}.actions .btn{display:none}footer{display:block}}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="index.html">STRUCTURAL<span>PRO</span></a><div class="actions"><a class="btn" href="products.html">Products</a><button class="lang" id="lang">فارسی</button></div></div></header>
<main class="wrap">
<section class="hero"><div class="ey">RESOURCES</div><h1 id="title">Resources for the AEC workflow.</h1><p class="lead" id="lead">Documentation, operational guidance and validated knowledge — with future content clearly separated from what is available today.</p><div class="note" id="principle"></div></section>
<section><div class="filters" id="filters"></div><div class="grid" id="grid"></div></section>
</main>
<footer class="wrap"><span>© StructuralPro — AEC Software Ecosystem</span><span>English · فارسی</span></footer>
<script>
const state={fa:new URLSearchParams(location.search).get("lang")==="fa"};
const copy={
en:{title:"Resources for the AEC workflow.",lead:"Documentation, operational guidance and validated knowledge — with future content clearly separated from what is available today.",available:"Available",planned:"Planned",all:"All",open:"Open resource",future:"Planned content"},
fa:{title:"منابع برای گردش‌کار AEC",lead:"مستندات، راهنمای عملیاتی و دانش اعتبارسنجی‌شده؛ محتوای آینده نیز کاملاً از محتوای موجود امروز جدا شده است.",available:"موجود",planned:"در برنامه",all:"همه",open:"باز کردن منبع",future:"محتوای در برنامه"}
};
const lang=state.fa?"fa":"en";document.documentElement.lang=lang;document.documentElement.dir=state.fa?"rtl":"ltr";
document.getElementById("lang").textContent=state.fa?"English":"فارسی";
document.getElementById("lang").onclick=()=>location.href=state.fa?"resources.html":"resources.html?lang=fa";
document.getElementById("title").textContent=copy[lang].title;document.getElementById("lead").textContent=copy[lang].lead;
const filters=document.getElementById("filters"),grid=document.getElementById("grid");
fetch("data/resources.json").then(r=>r.json()).then(data=>{
document.getElementById("principle").textContent=data.principle[lang];
const types=["All",...new Set(data.items.map(x=>x.type))];let active="All";
types.forEach(type=>{const b=document.createElement("button");b.className="filter"+(type==="All"?" active":"");b.textContent=type==="All"?copy[lang].all:type;b.onclick=()=>{active=type;[...filters.children].forEach(x=>x.classList.remove("active"));b.classList.add("active");render()};filters.append(b)});
function render(){grid.innerHTML="";data.items.filter(x=>active==="All"||x.type===active).forEach(item=>{
const c=document.createElement("article");c.className="card";const status=item.status==="Available"?copy[lang].available:copy[lang].planned;
const action=item.href?'<a class="link" href="'+item.href+'">'+copy[lang].open+' →</a>':'<span class="link">'+copy[lang].future+'</span>';
c.innerHTML='<div class="meta"><span>'+item.type+'</span><span class="status '+item.status.toLowerCase()+'">'+status+'</span></div><h2>'+item.title[lang]+'</h2><p>'+item.description[lang]+'</p><div class="footer">'+action+'</div>';grid.append(c);
});}render();
});
</script>
</body>
</html>
