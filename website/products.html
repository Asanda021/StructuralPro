<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StructuralPro Products</title><style>:root{--bg:#071222;--s:#0d1828;--r:#122033;--t:#f5f7fa;--m:#8c9aaf;--b:#2e3b4d;--a:#00d4f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.55 Inter,"Segoe UI",sans-serif}.wrap{width:min(calc(100% - 40px),1280px);margin:auto}header{padding:72px 0 36px;border-bottom:1px solid var(--b)}h1{font-size:clamp(40px,5vw,64px);line-height:1.05;margin:12px 0}.ey{color:var(--a);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.lead{color:var(--m);max-width:760px;font-size:18px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0}.filter{border:1px solid var(--b);background:var(--s);color:var(--t);padding:9px 13px;border-radius:999px;cursor:pointer}.filter.active{border-color:var(--a);color:var(--a)}section{padding:44px 0}.cat{margin-bottom:54px}.cat h2{font-size:28px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--s);border:1px solid var(--b);border-radius:16px;padding:22px;min-height:210px;display:flex;flex-direction:column}.badge{color:var(--a);font-size:12px;font-weight:700}.card h3{font-size:19px;margin:9px 0}.card p{color:var(--m);font-size:14px;margin:0 0 14px}.caps{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}.cap{background:var(--r);border-radius:8px;padding:5px 8px;color:var(--m);font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><div class="ey">PRODUCT ARCHITECTURE</div><h1>29 Specialized Products + 1 Enterprise Platform</h1><p class="lead">Explore StructuralPro by discipline and workflow. Product pages follow one consistent architecture while keeping each specialized tool focused.</p><div class="filters" id="filters"></div></div></header><main class="wrap" id="catalog"></main><script>const data={"schema_version":"1.0","ecosystem_label":"30 Products. One AEC Ecosystem.","specialized_product_count":29,"enterprise_platform_count":1,"categories":[{"id":"takeoff-estimating","name":"Takeoff & Estimating","products":[{"id":"takeoff","name":"StructuralPro Takeoff"},{"id":"cad-takeoff","name":"StructuralPro CAD Takeoff"},{"id":"bim-takeoff","name":"StructuralPro BIM Takeoff"},{"id":"boq","name":"StructuralPro BOQ"},{"id":"estimating","name":"StructuralPro Estimating"}]},{"id":"project-commercial","name":"Project & Commercial Management","products":[{"id":"technical-office","name":"StructuralPro Technical Office"},{"id":"site-supervisor","name":"StructuralPro Site Supervisor"},{"id":"project-controls","name":"StructuralPro Project Controls"},{"id":"project-manager","name":"StructuralPro Project Manager"},{"id":"cost-control","name":"StructuralPro Cost Control"},{"id":"contract-claims","name":"StructuralPro Contract & Claims"},{"id":"procurement","name":"StructuralPro Procurement"}]},{"id":"bim-ai-intelligence","name":"BIM, AI & Intelligence","products":[{"id":"bim-coordination","name":"StructuralPro BIM & Coordination"},{"id":"ai-assistant","name":"StructuralPro AI & AEC Assistant"},{"id":"reports-intelligence","name":"StructuralPro Reports & Intelligence"},{"id":"price-cost-intelligence","name":"StructuralPro Price & Cost Intelligence"}]},{"id":"engineering","name":"Engineering","products":[{"id":"structural-analysis-design","name":"StructuralPro Structural Analysis & Design"},{"id":"geotechnical","name":"StructuralPro Geotechnical"},{"id":"architecture","name":"StructuralPro Architecture"},{"id":"mep","name":"StructuralPro MEP"},{"id":"civil-site","name":"StructuralPro Civil & Site"},{"id":"concrete-engineering","name":"StructuralPro Concrete Engineering"},{"id":"steel-engineering","name":"StructuralPro Steel Engineering"},{"id":"masonry-engineering","name":"StructuralPro Masonry Engineering"},{"id":"timber-engineering","name":"StructuralPro Timber Engineering"},{"id":"composite-structures","name":"StructuralPro Composite Structures"},{"id":"precast","name":"StructuralPro Precast"},{"id":"special-structures","name":"StructuralPro Special Structures"}]},{"id":"enterprise","name":"Enterprise","products":[{"id":"aec-enterprise","name":"StructuralPro AEC Enterprise","platform":true}]}]};const descriptions={"Takeoff & Estimating":"Connected quantity, BOQ and estimating workflows.","Project & Commercial Management":"Technical, site, controls, commercial and procurement workflows.","BIM, AI & Intelligence":"Model coordination, AI assistance, reporting and cost intelligence.","Engineering":"Specialized AEC disciplines across the building lifecycle.","Enterprise":"Cross-product enterprise platform and governance."};const filter=document.getElementById("filters"),root=document.getElementById("catalog");const all=document.createElement("button");all.className="filter active";all.textContent="All";all.onclick=()=>render();filter.append(all);data.categories.forEach(c=>{const b=document.createElement("button");b.className="filter";b.textContent=c.name;b.onclick=()=>render(c.id);filter.append(b)});function render(active){root.innerHTML="";data.categories.filter(c=>!active||c.id===active).forEach(c=>{const sec=document.createElement("section");sec.className="cat";sec.innerHTML="<h2>"+c.name+"</h2><p class='lead'>"+descriptions[c.name]+"</p>";const grid=document.createElement("div");grid.className="grid";c.products.forEach(p=>{const card=document.createElement("article");card.className="card";card.innerHTML="<div class='badge'>"+(p.platform?"ENTERPRISE PLATFORM":c.name.toUpperCase())+"</div><h3>"+p.name+"</h3><p>"+descriptions[c.name]+"</p><div class='caps'><span class='cap'>Learn More</span><span class='cap'>Get Started</span></div>";grid.append(card)});sec.append(grid);root.append(sec)})}render();</script></body></html>
